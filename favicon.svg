<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Платформа АРХИ">
  <!--
    Знак изделия: ∀ — квантор всеобщности, «для всех».

    Выбран не как украшение. Изделие исполняет регламент по КАЖДОМУ объекту
    портфеля без исключения, и «нет данных» по объекту тоже есть исход, а не
    молчание. Знак «для всех» — это и есть содержание изделия одним символом.

    Буква нарисована ЛИНИЯМИ, а не текстом: текстовый ∀ зависел бы от шрифта
    на машине показывающего, а его состав заранее неизвестен — на одной машине
    знак вышел бы тонким, на другой не отрисовался бы вовсе.
  -->
  <defs>
    <linearGradient id="fon-znaka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#fon-znaka)"/>

  <!-- Перевёрнутая A: вершина внизу, перекладина по середине. -->
  <g fill="none" stroke="#ffffff" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15 L32 49 L46 15"/>
    <path d="M25 32 L39 32"/>
  </g>
</svg>
