<!DOCTYPE html><meta charset="utf-8"><body style="margin:0;background:#fff">
<iframe id="r" src="/index.html" style="width:414px;height:896px;border:0"></iframe>
<script>
document.getElementById("r").addEventListener("load",function(){
  var d=this.contentDocument;
  var shirina=d.documentElement.clientWidth, prokrutka=d.documentElement.scrollWidth;
  var vyl=[];
  d.querySelectorAll("body *").forEach(function(e){
    var r=e.getBoundingClientRect();
    if(r.width>0 && r.right>shirina+1){
      var im=e.tagName.toLowerCase()+(typeof e.className==="string"&&e.className?"."+e.className.trim().split(/\s+/)[0]:"");
      vyl.push(im+" до "+Math.round(r.right));
    }
  });
  // мелкий шрифт: что окажется меньше 12px — на телефоне не читается
  var melko=[];
  d.querySelectorAll("p,li,span,td,figcaption,a,h1,h2,h3,b").forEach(function(e){
    if(!e.textContent.trim()) return;
    var f=parseFloat(getComputedStyle(e).fontSize);
    if(f<12) melko.push(e.tagName.toLowerCase()+" "+f.toFixed(1)+"px");
  });
  // цели нажатия меньше 32px по высоте
  var melkieCeli=[];
  d.querySelectorAll("a,button,summary").forEach(function(e){
    var r=e.getBoundingClientRect();
    if(r.height>0 && r.height<32) melkieCeli.push((e.textContent.trim().slice(0,22)||e.tagName)+" h="+Math.round(r.height));
  });
  document.title="РЕЗУЛЬТАТ|ширина="+shirina+"|прокрутка="+prokrutka
    +"|вылезает="+(vyl.length?vyl.slice(0,10).join(" ;; "):"ничего")
    +"|мелкийшрифт="+(melko.length?melko.slice(0,6).join(", "):"нет")
    +"|мелкиецели="+(melkieCeli.length?melkieCeli.slice(0,8).join(", "):"нет");
});
</script>
