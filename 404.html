<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Визитка светлая всегда. Без этой строки браузер, выбравший
     тёмную тему за пользователя (так делает встроенный браузер
     Telegram), красит по-своему поля форм, полосы прокрутки
     и подложку до загрузки стилей. Сами цвета запирает
     public.css — одной этой строки недостаточно. -->
<meta name="color-scheme" content="light">
<title>Такого адреса нет — Платформа АРХИ</title>
<!-- Страница «адреса нет» из поиска исключается, и canonical у неё НЕ ставится:
     канонический адрес значит «вот настоящая страница вместо этой», а настоящей
     не существует. -->
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" sizes="32x32" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/public.css">
</head>
<body>

<main class="tekstovaya-stranica">
  <h1>Такого адреса здесь нет</h1>
  <p>
    Страница, на которую вы шли, не существует — либо её адрес изменился.
    Это визитка Платформы АРХИ, и на ней всего два адреса:
  </p>
  <ul>
    <li><a href="/">главная</a> — что платформа делает и что даёт;</li>
    <li><a href="/#zayavka">связаться</a> — попросить показ или дистрибутив.</li>
  </ul>
  <p class="nazad"><a href="/">← Вернуться на главную</a></p>
</main>

</body>
</html>
